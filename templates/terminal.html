{% extends "layout.html" %}

{% block title %}

Terminal

{% endblock %}

{% block main %}

<h1>Terminal</h1>
<form method="post">
    <input type="text" name="command" autofocus autocomplete="off" placeholder="Enter command">
    <button type="submit">Run</button>
</form>

<hr>

<div class="desktop">
    {% for item in items %}
        <div class="icon">
            {% if item.type == "folder" %}
                <div class="folder-icon">📁</div>
            {% else %}
                <div class="file-icon">📄</div>
            {% endif %}
            <div class="label">{{ item.name }}</div>
        </div>
    {% endfor %}
</div>

{% endblock %}
