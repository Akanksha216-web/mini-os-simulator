{% extends "layout.html" %}

{% block title %}
Terminal
{% endblock %}

{% block main %}

<p>home{{ current_path }}</p>

<form method="post" class = "command-line">
    <input type="text" name="command" autofocus autocomplete="off" placeholder="Enter command">
    <button type="submit">Run</button>
</form>

<hr>

<div class="desktop">
    {% for item in items %}
    <div class="icon">

        {% if item.type == "file" %}
            <a href="{{ url_for('open_file', file_id=item.id) }}">
                <div class="file-icon">📄</div>
            </a>
        {% else %}
            <a href="{{ url_for('open_folder', folder_id=item.id) }}">
                <div class="folder-icon">📁</div>
            </a>
        {% endif %}

        <div class="label">{{ item.name }}</div>

    </div>
    {% endfor %}
</div>

{% if output %}
<pre class="terminal-output">{{ output }}</pre>
{% endif %}

{% endblock %}
