{% extends "layout.html" %}

{% block title %}
Terminal
{% endblock %}

{% block main %}

<p>home{{ current_path }}</p>

<form method="post" class = "command-line">
    <input type="text" name="command" autofocus autocomplete="off" placeholder="Enter command" class="command">
    <button type="submit" class = "run-btn">Run</button>
</form>

<hr>

<div class="desktop">
    {% for item in items %}
    <div class="icon">

        {% if item.type == "file" %}
            <a href="{{ url_for('open_file', file_id=item.id) }}">
                <div class="file-icon">📄</div>
            </a>
        {% else %}
            <a href="{{ url_for('open_folder', folder_id=item.id) }}">
                <div class="folder-icon">📁</div>
            </a>
        {% endif %}

        <div class="label">{{ item.name }}</div>

    </div>
    {% endfor %}
</div>

{% if output %}
<pre class="terminal-output">{{ output }}</pre>
{% endif %}

<style>

.run-btn {
background-color: #0d6efd;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
}

.run-btn:hover {
            background-color: #0b5ed7;
    
}

.command {
    border: none;
            padding: 8px 18px;
            border-radius: 6px;
            margin-right: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
}

.icon:hover {
            border : 1px solid white;
            border-radius: 6px;
        }

</style>
{% endblock %}
