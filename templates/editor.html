<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ file.name }}</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: "Segoe UI", sans-serif;
            background-color: #ffffff;
        }

        /* Top tab bar */
        .tab-bar {
            height: 50px;
            background-color: #f3f3f3;
            border-bottom: 1px solid #dcdcdc;
            display: flex;
            align-items: center;
            padding-left: 15px;
        }

        .tab {
            background: white;
            border: 1px solid #dcdcdc;
            border-bottom: none;
            padding: 12px 20px;
            border-radius: 8px 8px 0 0;
            font-size: 14px;
            font-weight: 500;
        }

        /* Save button row */
        .toolbar {
            height: 45px;
            border-bottom: 1px solid #e5e5e5;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 0 20px;
        }

        .save-btn {
            background-color: #0d6efd;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .save-btn:hover {
            background-color: #0b5ed7;
        }

        /* Editor */
        .editor-form {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        textarea {
            flex: 1;
            width: 100%;
            border: none;
            outline: none;
            resize: none;
            padding: 25px;
            font-size: 16px;
            line-height: 1.6;
            font-family: Consolas, monospace;
            background: white;
        }

        /* Bottom status bar */
        .status-bar {
            height: 32px;
            border-top: 1px solid #dcdcdc;
            background: #f7f7f7;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>

<body>

    <div class="tab-bar">
        <div class="tab">
            {{ file.name }}
        </div>
    </div>

    <form method="post" class="editor-form">

        <div class="toolbar">
            <button type="submit" class="save-btn">
                Save
            </button>
        </div>

        <textarea name="content">{{ file.content }}</textarea>

    </form>

    <div class="status-bar">
        <span>Plain Text</span>
        <span>{{ file.name }}</span>
    </div>

</body>
</html>
